<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">與 ERP／PDM 交換資料的三種架構</text>

  <!-- headers -->
  <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="20" y="48" width="275" height="36" rx="6" fill="#1d4ed8"/>
    <text x="157" y="72">A. 檔案交換</text>
    <rect x="312" y="48" width="275" height="36" rx="6" fill="#b45309"/>
    <text x="449" y="72">B. 中介資料庫（Staging）</text>
    <rect x="604" y="48" width="276" height="36" rx="6" fill="#047857"/>
    <text x="742" y="72">C. Web API</text>
  </g>

  <!-- A -->
  <g font-size="13" fill="#1f2937">
    <rect x="20" y="96" width="275" height="56" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="32" y="118" font-weight="bold">AVEVA（PML 或 Vitesse）</text>
    <text x="32" y="138" font-size="12">FILE 物件寫出 CSV／XML</text>
    <rect x="20" y="176" width="275" height="56" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
    <text x="32" y="198" font-weight="bold">共用資料夾（交換區）</text>
    <text x="32" y="218" font-size="12">out\ 待處理　done\ 已處理　err\ 錯誤</text>
    <rect x="20" y="256" width="275" height="56" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="32" y="278" font-weight="bold">ERP 匯入程式</text>
    <text x="32" y="298" font-size="12">排程掃描、驗證、匯入、搬移檔案</text>
  </g>
  <g stroke="#374151" stroke-width="2" marker-end="url(#arr)">
    <line x1="157" y1="152" x2="157" y2="172"/>
    <line x1="157" y1="232" x2="157" y2="252"/>
  </g>

  <!-- B -->
  <g font-size="13" fill="#1f2937">
    <rect x="312" y="96" width="275" height="56" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="324" y="118" font-weight="bold">AVEVA（.NET Add-in 或獨立程式）</text>
    <text x="324" y="138" font-size="12">以 ADO.NET 寫入中介表</text>
    <rect x="312" y="176" width="275" height="56" rx="6" fill="#ffffff" stroke="#b45309"/>
    <text x="324" y="198" font-weight="bold">中介資料表</text>
    <text x="324" y="218" font-size="12">批次編號、狀態欄（NEW／DONE／ERR）</text>
    <rect x="312" y="256" width="275" height="56" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="324" y="278" font-weight="bold">ERP 端預存程序或排程</text>
    <text x="324" y="298" font-size="12">讀取 NEW、回寫狀態與錯誤訊息</text>
  </g>
  <g stroke="#374151" stroke-width="2" marker-end="url(#arr)">
    <line x1="449" y1="152" x2="449" y2="172"/>
    <line x1="449" y1="232" x2="449" y2="252"/>
  </g>

  <!-- C -->
  <g font-size="13" fill="#1f2937">
    <rect x="604" y="96" width="276" height="56" rx="6" fill="#ecfdf5" stroke="#047857"/>
    <text x="616" y="118" font-weight="bold">AVEVA（.NET Add-in）</text>
    <text x="616" y="138" font-size="12">HttpWebRequest 呼叫 API</text>
    <rect x="604" y="176" width="276" height="56" rx="6" fill="#ffffff" stroke="#047857"/>
    <text x="616" y="198" font-weight="bold">公司 API 閘道</text>
    <text x="616" y="218" font-size="12">驗證、限流、版本、稽核記錄</text>
    <rect x="604" y="256" width="276" height="56" rx="6" fill="#ecfdf5" stroke="#047857"/>
    <text x="616" y="278" font-weight="bold">ERP／PDM 服務</text>
    <text x="616" y="298" font-size="12">即時查詢料號、回傳驗證結果</text>
  </g>
  <g stroke="#374151" stroke-width="2" marker-end="url(#arr)">
    <line x1="742" y1="152" x2="742" y2="172"/>
    <line x1="742" y1="232" x2="742" y2="252"/>
  </g>

  <!-- comparison table -->
  <g font-size="13" fill="#1f2937">
    <rect x="20" y="334" width="860" height="30" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="32" y="354" font-weight="bold">比較項目</text>
    <text x="180" y="354" font-weight="bold">A. 檔案交換</text>
    <text x="440" y="354" font-weight="bold">B. 中介資料庫</text>
    <text x="680" y="354" font-weight="bold">C. Web API</text>

    <rect x="20" y="364" width="860" height="30" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="384">實作語言</text>
    <text x="180" y="384">PML 即可</text>
    <text x="440" y="384">需要 .NET</text>
    <text x="680" y="384">需要 .NET</text>

    <rect x="20" y="394" width="860" height="30" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="32" y="414">即時性</text>
    <text x="180" y="414">低（分鐘到每日）</text>
    <text x="440" y="414">中（排程輪詢）</text>
    <text x="680" y="414">高（同步呼叫）</text>

    <rect x="20" y="424" width="860" height="30" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="444">耦合程度</text>
    <text x="180" y="444">最低，雙方只約定格式</text>
    <text x="440" y="444">中，約定資料表結構</text>
    <text x="680" y="444">高，網路或服務中斷會影響設計</text>

    <rect x="20" y="454" width="860" height="30" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="32" y="474">追蹤與重送</text>
    <text x="180" y="474">保留檔案即可重送</text>
    <text x="440" y="474">狀態欄天然可追蹤</text>
    <text x="680" y="474">需自行記錄請求與回應</text>

    <rect x="20" y="484" width="860" height="30" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="504">適合情境</text>
    <text x="180" y="504">材料表、重量表、每日匯出</text>
    <text x="440" y="504">大量明細、需要回寫狀態</text>
    <text x="680" y="504">建模時即時驗證料號</text>
  </g>

  <rect x="20" y="530" width="860" height="76" rx="6" fill="#fff7ed" stroke="#c2410c"/>
  <text x="34" y="554" font-size="14" font-weight="bold" fill="#1f2937">建議起點</text>
  <text x="34" y="576" font-size="13" fill="#1f2937">先做 A（唯讀匯出、檔案交換），把格式與對帳流程穩定下來；確定需要回寫狀態再升級到 B；</text>
  <text x="34" y="596" font-size="13" fill="#1f2937">C 只用在「設計當下必須知道答案」的情境，並且要有離線時的降級行為（例如先記錄、稍後重試）。</text>
</svg>
