<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">PML Add-in 載入流程（以 MYCOLLECT 為例）</text>

  <g font-size="13" fill="#1f2937">
    <!-- step 1 -->
    <rect x="30" y="54" width="400" height="74" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="44" y="78" font-weight="bold">1. 模組啟動（Outfitting／Design）</text>
    <text x="44" y="100">環境變數已由啟動批次檔設定：PMLLIB、PDMSUI</text>
    <text x="44" y="120">建立 PML 索引（掃描 PMLLIB 的 pml.index）</text>

    <!-- step 2 -->
    <rect x="30" y="150" width="400" height="96" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="44" y="174" font-weight="bold">2. 讀取 Add-in 定義目錄的每個檔案</text>
    <text x="44" y="196" font-family="Consolas, monospace">%PDMSUI%\DES\DFLTS\ADDINS\MYCOLLECT</text>
    <text x="44" y="218" font-family="Consolas, monospace">Name: MYCOLLECT</text>
    <text x="44" y="238" font-family="Consolas, monospace">Object: APPMYCOLLECT</text>

    <!-- step 3 -->
    <rect x="30" y="268" width="400" height="74" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="44" y="292" font-weight="bold">3. 依 Object 名稱在 PMLLIB 找物件定義</text>
    <text x="44" y="314" font-family="Consolas, monospace">appmycollect.pmlobj → object APPMYCOLLECT()</text>
    <text x="44" y="334">建構子 .appmycollect() 執行（應保持輕量）</text>

    <!-- step 4 -->
    <rect x="30" y="364" width="400" height="74" rx="6" fill="#f5f3ff" stroke="#6d28d9"/>
    <text x="44" y="388" font-weight="bold">4. 定義主表單時：.modifyForm()（選用）</text>
    <text x="44" y="410">可在主視窗加入自己的工具列</text>
    <text x="44" y="430" fill="#6b7280">本範例沒有定義，系統會略過</text>

    <!-- step 5 -->
    <rect x="30" y="460" width="400" height="96" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="44" y="484" font-weight="bold">5. 建立選單時：.modifyMenus()</text>
    <text x="44" y="506" font-family="Consolas, monospace">!menu = object APPMENU('SYSUTIL')</text>
    <text x="44" y="526" font-family="Consolas, monospace">!menu.add('CALLBACK', ..., 'show !!mycollect', ...)</text>
    <text x="44" y="546" font-family="Consolas, monospace">!!appMenuCntrl.addMenu(!menu, 'ALL')</text>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="230" y1="128" x2="230" y2="148" marker-end="url(#arr)"/>
    <line x1="230" y1="246" x2="230" y2="266" marker-end="url(#arr)"/>
    <line x1="230" y1="342" x2="230" y2="362" marker-end="url(#arr)"/>
    <line x1="230" y1="438" x2="230" y2="458" marker-end="url(#arr)"/>
  </g>

  <!-- right side: menu controller -->
  <g font-size="13" fill="#1f2937">
    <rect x="490" y="440" width="380" height="132" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
    <text x="504" y="464" font-weight="bold">!!appMenuCntrl（選單控制器）</text>
    <text x="504" y="486">記下「哪個應用程式要顯示哪些選單項」</text>
    <text x="504" y="508">切換應用程式時自動顯示／隱藏</text>
    <text x="504" y="530">同名欄位只加一次（避免重複）</text>
    <text x="504" y="556" fill="#0e7490">'ALL' = 所有應用程式都顯示</text>

    <rect x="490" y="250" width="380" height="150" rx="6" fill="#ffffff" stroke="#6b7280"/>
    <rect x="490" y="250" width="380" height="28" rx="6" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="504" y="269" font-weight="bold">Utilities 選單（SYSUTIL）</text>
    <text x="516" y="302">（官方原有項目）</text>
    <line x1="510" y1="320" x2="850" y2="320" stroke="#9ca3af"/>
    <text x="516" y="344" fill="#6b7280">myCollectSep（分隔線）</text>
    <rect x="506" y="356" width="348" height="28" rx="4" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="516" y="375" font-weight="bold">My EQUI Collector...</text>

    <rect x="490" y="54" width="380" height="160" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="504" y="78" font-weight="bold">6. 使用者點選選單項</text>
    <text x="504" y="102">執行回呼字串 show !!mycollect</text>
    <text x="504" y="124">→ 第一次才載入 mycollect.pmlfrm</text>
    <text x="504" y="146">→ 表單生命週期（見圖 13-1）</text>
    <text x="504" y="178" fill="#b91c1c">選單沒出現？先查：定義檔位置、</text>
    <text x="504" y="198" fill="#b91c1c">Object 名稱、pmlobj 是否在索引中</text>
  </g>
  <line x1="430" y1="508" x2="486" y2="508" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="680" y1="440" x2="680" y2="404" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="680" y1="356" x2="680" y2="218" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <text x="30" y="596" font-size="12" fill="#6b7280">方法名稱與呼叫時機依官方 Software Customisation Guide（E3D 1.1）PML Add-ins 章節；Add-in 目錄位置依 Marine 12.1 開源範例，請以公司版本核對。</text>
</svg>
