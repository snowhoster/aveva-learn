<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <rect x="0" y="0" width="900" height="550" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">組立樹：設計結構與建造結構是兩棵不同的樹</text>

  <!-- left: design tree -->
  <text x="160" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">設計視角（依構件）</text>
  <g font-size="13" fill="#1f2937">
    <rect x="40" y="80" width="240" height="40" rx="5" fill="#eef2ff" stroke="#6366f1"/>
    <text x="160" y="105" text-anchor="middle">BLOCK B21（分段）</text>
    <rect x="70" y="140" width="210" height="40" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="175" y="165" text-anchor="middle">HPANEL 內底板 DB-B21</text>
    <rect x="70" y="195" width="210" height="40" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="175" y="220" text-anchor="middle">HPANEL 實肋板 FL-FR42</text>
    <rect x="70" y="250" width="210" height="40" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="175" y="275" text-anchor="middle">HPANEL 縱桁 GD-LP3</text>
    <rect x="70" y="305" width="210" height="40" rx="5" fill="#ecfdf5" stroke="#059669"/>
    <text x="175" y="330" text-anchor="middle">CPANEL 船底外板</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <polyline points="55,120 55,325 70,325"/>
    <line x1="55" y1="160" x2="70" y2="160"/>
    <line x1="55" y1="215" x2="70" y2="215"/>
    <line x1="55" y1="270" x2="70" y2="270"/>
  </g>
  <text x="40" y="378" font-size="12" fill="#374151">板架內的板與加強材抽出後，</text>
  <text x="40" y="396" font-size="12" fill="#374151">變成一個個板零件與型材零件。</text>

  <!-- middle arrow -->
  <line x1="300" y1="210" x2="355" y2="210" stroke="#d97706" stroke-width="3"/>
  <path d="M355,202 L370,210 L355,218 z" fill="#d97706"/>
  <text x="335" y="190" text-anchor="middle" font-size="12" fill="#92400e">裝配規劃</text>

  <!-- right: assembly tree -->
  <text x="630" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">建造視角（依裝配順序）</text>
  <g font-size="13" fill="#1f2937">
    <rect x="390" y="80" width="200" height="40" rx="5" fill="#fef3c7" stroke="#d97706"/>
    <text x="490" y="105" text-anchor="middle">分段 B21</text>

    <rect x="420" y="140" width="200" height="40" rx="5" fill="#fff7ed" stroke="#fb923c"/>
    <text x="520" y="165" text-anchor="middle">大組立 B21-A（底部）</text>

    <rect x="450" y="195" width="200" height="40" rx="5" fill="#fff7ed" stroke="#fb923c"/>
    <text x="550" y="220" text-anchor="middle">小組立：實肋板 FR42</text>

    <rect x="480" y="250" width="180" height="36" rx="5" fill="#ffffff" stroke="#9ca3af"/>
    <text x="570" y="273" text-anchor="middle" font-size="12">板零件 B21-FL42-1</text>
    <rect x="480" y="296" width="180" height="36" rx="5" fill="#ffffff" stroke="#9ca3af"/>
    <text x="570" y="319" text-anchor="middle" font-size="12">型材零件 B21-FL42-S1</text>
    <rect x="480" y="342" width="180" height="36" rx="5" fill="#ffffff" stroke="#9ca3af"/>
    <text x="570" y="365" text-anchor="middle" font-size="12">肘板零件 B21-FL42-K1</text>

    <rect x="450" y="396" width="200" height="40" rx="5" fill="#fff7ed" stroke="#fb923c"/>
    <text x="550" y="421" text-anchor="middle">小組立：縱桁 LP3</text>

    <rect x="420" y="452" width="200" height="40" rx="5" fill="#fff7ed" stroke="#fb923c"/>
    <text x="520" y="477" text-anchor="middle">大組立 B21-B（內底）</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <polyline points="405,120 405,472 420,472"/>
    <line x1="405" y1="160" x2="420" y2="160"/>
    <polyline points="435,180 435,416 450,416"/>
    <line x1="435" y1="215" x2="450" y2="215"/>
    <polyline points="465,235 465,360 480,360"/>
    <line x1="465" y1="268" x2="480" y2="268"/>
    <line x1="465" y1="314" x2="480" y2="314"/>
  </g>

  <!-- weld info -->
  <g font-size="12" fill="#374151">
    <rect x="690" y="240" width="190" height="150" rx="6" fill="#f0f9ff" stroke="#0284c7"/>
    <text x="785" y="262" text-anchor="middle" font-weight="bold" fill="#075985">焊接規劃（Weld Planning）</text>
    <text x="702" y="286">掛在組立節點上：</text>
    <text x="702" y="306">・哪兩個零件相接</text>
    <text x="702" y="326">・焊道長度與型式</text>
    <text x="702" y="346">・焊接姿勢（平、立、仰）</text>
    <text x="702" y="366">・由規則自動計算</text>
  </g>
  <line x1="660" y1="215" x2="690" y2="270" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="40" y="440" font-size="12" fill="#374151">零件編號範例為示意，</text>
  <text x="40" y="458" font-size="12" fill="#374151">實際命名規則依船廠規範。</text>
  <text x="40" y="530" font-size="12" fill="#6b7280">開發觀點：同一批零件同時屬於兩棵樹，報表必須先講清楚「依設計樹」還是「依組立樹」統計。</text>
</svg>
