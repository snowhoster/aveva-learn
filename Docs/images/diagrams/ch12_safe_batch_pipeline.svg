<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">批次修改的安全模式：預覽 → 記錄 → 寫入 → 驗證 → 儲存</text>

  <g font-size="13" fill="#1f2937">
    <!-- 1 -->
    <rect x="20" y="60" width="160" height="170" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="100" y="86" text-anchor="middle" font-size="15" font-weight="bold">1. 預覽</text>
    <text x="32" y="112">收集目標元素</text>
    <text x="32" y="134">計算新值</text>
    <text x="32" y="156">列出「舊值→新值」</text>
    <text x="32" y="178">不寫入任何資料</text>
    <text x="32" y="210" fill="#1d4ed8">使用者按「確定」</text>

    <!-- 2 -->
    <rect x="196" y="60" width="160" height="170" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="276" y="86" text-anchor="middle" font-size="15" font-weight="bold">2. 記錄</text>
    <text x="208" y="112">把每筆的參照、</text>
    <text x="208" y="134">舊值、新值寫到</text>
    <text x="208" y="156">CSV 記錄檔</text>
    <text x="208" y="178">（回復的依據）</text>
    <text x="208" y="210" fill="#b45309">先寫檔，後改模型</text>

    <!-- 3 -->
    <rect x="372" y="60" width="160" height="170" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
    <text x="452" y="86" text-anchor="middle" font-size="15" font-weight="bold">3. 寫入</text>
    <text x="384" y="112">逐筆 claim</text>
    <text x="384" y="134">設定屬性</text>
    <text x="384" y="156">每筆後面接 handle</text>
    <text x="384" y="178">失敗只記錄、不中斷</text>
    <text x="384" y="210" fill="#6d28d9">統計成功／失敗數</text>

    <!-- 4 -->
    <rect x="548" y="60" width="160" height="170" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="628" y="86" text-anchor="middle" font-size="15" font-weight="bold">4. 驗證</text>
    <text x="560" y="112">重新讀回屬性</text>
    <text x="560" y="134">與預期新值比對</text>
    <text x="560" y="156">顯示摘要：</text>
    <text x="560" y="178">成功 N、失敗 M</text>
    <text x="560" y="210" fill="#15803d">人工確認結果</text>

    <!-- 5 -->
    <rect x="724" y="60" width="156" height="170" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
    <text x="802" y="86" text-anchor="middle" font-size="15" font-weight="bold">5. 儲存</text>
    <text x="736" y="112">savework</text>
    <text x="736" y="134">變更才對他人可見</text>
    <text x="736" y="156">之後才能 unclaim</text>
    <text x="736" y="178">已改過的元素</text>
    <text x="736" y="210" fill="#0e7490">保留記錄檔</text>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="180" y1="145" x2="194" y2="145" marker-end="url(#arr)"/>
    <line x1="356" y1="145" x2="370" y2="145" marker-end="url(#arr)"/>
    <line x1="532" y1="145" x2="546" y2="145" marker-end="url(#arr)"/>
    <line x1="708" y1="145" x2="722" y2="145" marker-end="url(#arr)"/>
  </g>

  <!-- rollback -->
  <path d="M 628 230 L 628 290 L 276 290 L 276 234" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrr)"/>
  <text x="290" y="310" font-size="13" fill="#b91c1c">驗證不通過：依記錄檔把舊值寫回（或使用 undo 標記），不要 savework</text>

  <!-- developer mapping -->
  <rect x="20" y="320" width="860" height="180" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="36" y="346" font-size="14" font-weight="bold" fill="#1f2937">對照資料庫開發人員熟悉的做法</text>
  <g font-size="13" fill="#1f2937">
    <text x="36" y="374">• 預覽 ≈ 先跑 SELECT 看影響筆數，再決定要不要跑 UPDATE。</text>
    <text x="36" y="400">• 記錄 ≈ 自己寫的稽核表（audit log）：PML 沒有可以隨時 ROLLBACK 的交易，回復靠你留下的舊值。</text>
    <text x="36" y="426">• claim ≈ 資料列鎖定；savework ≈ COMMIT，之後別人執行 getwork 才看得到。</text>
    <text x="36" y="452">• 逐筆 handle ≈ 每筆各自 try/catch，一筆失敗不影響其他筆，最後彙總報告。</text>
    <text x="36" y="478">• 驗證 ≈ 寫完後再查一次的整合測試，確認「寫進去的就是想寫的」。</text>
  </g>
</svg>
