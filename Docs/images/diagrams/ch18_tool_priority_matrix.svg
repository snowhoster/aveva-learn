<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">公司工具的優先順序：效益與資料風險</text>

  <!-- quadrants -->
  <rect x="90" y="56" width="300" height="200" fill="#ecfdf5" stroke="#94a3b8"/>
  <rect x="390" y="56" width="300" height="200" fill="#fef3c7" stroke="#94a3b8"/>
  <rect x="90" y="256" width="300" height="200" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="390" y="256" width="300" height="200" fill="#fee2e2" stroke="#94a3b8"/>
  <g font-size="13" font-weight="bold" fill="#475569">
    <text x="100" y="76">先做：高效益、低風險</text>
    <text x="400" y="76">規劃後做：高效益、高風險</text>
    <text x="100" y="276">有空再做：低效益、低風險</text>
    <text x="400" y="276">避免自動化：效益不抵風險</text>
  </g>

  <!-- axes -->
  <line x1="90" y1="456" x2="700" y2="456" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="90" y1="456" x2="90" y2="50" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390" y="482" font-size="14" text-anchor="middle" fill="#1f2937">資料風險（會不會改到模型、影響多少下游）→</text>
  <text x="56" y="256" font-size="14" text-anchor="middle" fill="#1f2937" transform="rotate(-90 56 256)">每週節省工時與錯誤 →</text>

  <!-- points -->
  <g font-size="12" fill="#1f2937">
    <circle cx="160" cy="120" r="9" fill="#047857"/>
    <text x="176" y="116" font-weight="bold">① 唯讀查詢與報表</text>
    <text x="176" y="132">未定義材質的板清單</text>

    <circle cx="230" cy="190" r="9" fill="#047857"/>
    <text x="246" y="186" font-weight="bold">② 檢查工具</text>
    <text x="246" y="202">命名、屬性完整性</text>

    <circle cx="440" cy="150" r="9" fill="#b45309"/>
    <text x="456" y="146" font-weight="bold">③ 輔助建立</text>
    <text x="456" y="162">標準支架、標準開孔</text>

    <circle cx="610" cy="110" r="9" fill="#b45309"/>
    <text x="520" y="96" font-weight="bold">⑤ 系統整合</text>
    <text x="520" y="132">ERP／PDM 交換</text>

    <circle cx="560" cy="210" r="9" fill="#dc2626"/>
    <text x="470" y="236" font-weight="bold">④ 批次修改</text>

    <circle cx="180" cy="360" r="9" fill="#64748b"/>
    <text x="196" y="356" font-weight="bold">個人便利巨集</text>
    <text x="196" y="372">只有一人使用</text>

    <circle cx="560" cy="380" r="9" fill="#991b1b"/>
    <text x="440" y="406" font-weight="bold">自動修改船體拓撲</text>
    <text x="440" y="422">重建板架、改邊界參考</text>
  </g>

  <!-- process on right -->
  <text x="790" y="66" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2937">立案流程</text>
  <g font-size="12" fill="#1f2937">
    <rect x="712" y="80" width="160" height="42" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="792" y="106" text-anchor="middle">1. 需求單（誰、痛點）</text>
    <rect x="712" y="140" width="160" height="42" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="792" y="166" text-anchor="middle">2. 評估（效益、風險）</text>
    <rect x="712" y="200" width="160" height="42" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="792" y="226" text-anchor="middle">3. 唯讀原型</text>
    <rect x="712" y="260" width="160" height="42" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="792" y="286" text-anchor="middle">4. 審查與測試</text>
    <rect x="712" y="320" width="160" height="42" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="792" y="346" text-anchor="middle">5. 試用→正式發佈</text>
    <rect x="712" y="380" width="160" height="42" rx="6" fill="#ecfdf5" stroke="#047857"/>
    <text x="792" y="406" text-anchor="middle">6. 維護與 SP 回歸</text>
  </g>
  <g stroke="#374151" stroke-width="2" marker-end="url(#arr)">
    <line x1="792" y1="122" x2="792" y2="136"/>
    <line x1="792" y1="182" x2="792" y2="196"/>
    <line x1="792" y1="242" x2="792" y2="256"/>
    <line x1="792" y1="302" x2="792" y2="316"/>
    <line x1="792" y1="362" x2="792" y2="376"/>
  </g>

  <rect x="20" y="500" width="860" height="86" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="34" y="522" font-size="14" font-weight="bold" fill="#1f2937">判讀方式</text>
  <text x="34" y="544" font-size="13" fill="#1f2937">• 編號 ① 到 ⑤ 是建議的導入順序；右上角的工具價值高，但要先有 ① ② 累積的資料理解與信任</text>
  <text x="34" y="566" font-size="13" fill="#1f2937">• 任何落在「高風險」一側的工具，立案時必須附上：預覽畫面、回復方式、負責審查的領域人員</text>
</svg>
