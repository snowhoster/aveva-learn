<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="a6" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4b5563"/>
    </marker>
    <marker id="a6r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">從船體模型到生產資料：一條「物化」的資料管線</text>

  <!-- pipeline -->
  <g font-size="13" fill="#1f2937">
    <rect x="20" y="60" width="150" height="70" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="95" y="86" text-anchor="middle" font-weight="bold">船體 3D 模型</text>
    <text x="95" y="106" text-anchor="middle" font-size="12">板架、曲面板</text>
    <text x="95" y="122" text-anchor="middle" font-size="12">（真正的來源）</text>

    <rect x="195" y="60" width="150" height="70" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="270" y="86" text-anchor="middle" font-weight="bold">零件抽出</text>
    <text x="270" y="106" text-anchor="middle" font-size="12">產生板零件</text>
    <text x="270" y="122" text-anchor="middle" font-size="12">與型材零件</text>

    <rect x="370" y="60" width="150" height="70" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="445" y="86" text-anchor="middle" font-weight="bold">零件 Databank</text>
    <text x="445" y="106" text-anchor="middle" font-size="12">板零件、型材零件</text>
    <text x="445" y="122" text-anchor="middle" font-size="12">（快照）</text>

    <rect x="545" y="60" width="150" height="70" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="620" y="86" text-anchor="middle" font-weight="bold">套料</text>
    <text x="620" y="106" text-anchor="middle" font-size="12">板材套料</text>
    <text x="620" y="122" text-anchor="middle" font-size="12">型材套料</text>

    <rect x="720" y="60" width="160" height="70" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="800" y="86" text-anchor="middle" font-weight="bold">切割與加工資料</text>
    <text x="800" y="106" text-anchor="middle" font-size="12">NC、切割草圖</text>
    <text x="800" y="122" text-anchor="middle" font-size="12">型材草圖、樣板</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.6" marker-end="url(#a6)">
    <line x1="170" y1="95" x2="193" y2="95"/>
    <line x1="345" y1="95" x2="368" y2="95"/>
    <line x1="520" y1="95" x2="543" y2="95"/>
    <line x1="695" y1="95" x2="718" y2="95"/>
    <line x1="445" y1="130" x2="445" y2="178"/>
    <line x1="800" y1="130" x2="800" y2="178"/>
  </g>
  <g font-size="13" fill="#1f2937">
    <rect x="330" y="180" width="230" height="58" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="445" y="204" text-anchor="middle" font-weight="bold">生產資料庫（Oracle）</text>
    <text x="445" y="224" text-anchor="middle" font-size="12">供公司自建的生產程式讀取</text>

    <rect x="680" y="180" width="200" height="58" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="780" y="204" text-anchor="middle" font-weight="bold">現場</text>
    <text x="780" y="224" text-anchor="middle" font-size="12">切割機、彎管、裝配</text>
  </g>
  <text x="20" y="214" font-size="12" fill="#374151">收縮補償、劃線、坡口、餘量</text>
  <text x="20" y="232" font-size="12" fill="#374151">都在「抽出」這一步加入零件資料</text>

  <!-- snapshot timeline -->
  <text x="20" y="290" font-size="15" font-weight="bold" fill="#1f2937">為什麼說生產資料是「快照」</text>
  <line x1="40" y1="360" x2="860" y2="360" stroke="#9ca3af" stroke-width="2" marker-end="url(#a6)"/>
  <text x="860" y="384" text-anchor="end" font-size="12" fill="#6b7280">時間</text>

  <g font-size="12" fill="#1f2937">
    <circle cx="90" cy="360" r="7" fill="#6366f1"/>
    <text x="90" y="330" text-anchor="middle" font-weight="bold">t1</text>
    <text x="90" y="398" text-anchor="middle">模型 Rev A</text>

    <circle cx="270" cy="360" r="7" fill="#d97706"/>
    <text x="270" y="330" text-anchor="middle" font-weight="bold">t2</text>
    <text x="270" y="398" text-anchor="middle">抽出零件</text>
    <text x="270" y="416" text-anchor="middle">零件內容＝Rev A</text>

    <circle cx="470" cy="360" r="7" fill="#6366f1"/>
    <text x="470" y="330" text-anchor="middle" font-weight="bold">t3</text>
    <text x="470" y="398" text-anchor="middle">模型修改為 Rev B</text>
    <text x="470" y="416" text-anchor="middle">（例如移動一條接縫）</text>

    <circle cx="690" cy="360" r="7" fill="#dc2626"/>
    <text x="690" y="330" text-anchor="middle" font-weight="bold">t4</text>
    <text x="690" y="398" text-anchor="middle" fill="#b91c1c">若未重新抽出</text>
    <text x="690" y="416" text-anchor="middle" fill="#b91c1c">現場仍拿到 Rev A 的零件</text>
  </g>
  <path d="M270,352 C380,300 580,300 682,350" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#a6r)"/>
  <text x="480" y="300" text-anchor="middle" font-size="12" fill="#b91c1c">舊快照被沿用</text>

  <rect x="20" y="446" width="860" height="98" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <g font-size="12" fill="#374151">
    <text x="36" y="470" font-weight="bold" fill="#1f2937">開發對照</text>
    <text x="36" y="492">模型＝來源資料表；零件 Databank＝物化檢視（Materialized View），只在「抽出」時重新整理。</text>
    <text x="36" y="514">一致性檢查的思路：比對模型的修改時間或修改旗標（例如 IsChgd）與零件的抽出時間。</text>
    <text x="36" y="535">旗標與時間欄位的實際名稱、可讀取的介面，請在公司版本確認〔待核對〕。</text>
  </g>
</svg>
