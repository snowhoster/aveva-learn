<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="ax" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">船舶座標系、肋位（FR）與縱向位置（LP）</text>

  <!-- side view -->
  <text x="30" y="62" font-size="15" font-weight="bold" fill="#374151">側視（Profile）：X 向艏、Z 向上</text>
  <path d="M90 250 L 90 140 L 740 140 L 800 120 L 830 120 L 790 250 Z" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <line x1="90" y1="175" x2="760" y2="175" stroke="#0369a1" stroke-dasharray="6,4"/>
  <text x="600" y="168" font-size="13" fill="#0c4a6e">主甲板 Z = 12000（示意）</text>
  <!-- baseline -->
  <line x1="60" y1="250" x2="840" y2="250" stroke="#6b7280"/>
  <text x="846" y="254" font-size="12" fill="#6b7280">基線</text>
  <!-- frames -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="150" y1="140" x2="150" y2="250"/>
    <line x1="230" y1="140" x2="230" y2="250"/>
    <line x1="310" y1="140" x2="310" y2="250"/>
    <line x1="390" y1="140" x2="390" y2="250"/>
    <line x1="470" y1="140" x2="470" y2="250"/>
    <line x1="550" y1="140" x2="550" y2="250"/>
    <line x1="630" y1="140" x2="630" y2="250"/>
    <line x1="710" y1="140" x2="710" y2="250"/>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="90" y="268">FR0</text>
    <text x="150" y="268">FR10</text>
    <text x="230" y="268">FR20</text>
    <text x="310" y="268">FR30</text>
    <text x="390" y="268">…</text>
    <text x="550" y="268">FR80</text>
    <text x="630" y="268">FR90</text>
  </g>
  <!-- FR85+200 marker -->
  <line x1="598" y1="130" x2="598" y2="250" stroke="#b45309" stroke-width="2.5"/>
  <text x="598" y="122" font-size="13" text-anchor="middle" fill="#b45309" font-weight="bold">FR85+200</text>
  <!-- axes -->
  <line x1="90" y1="250" x2="170" y2="250" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ax)"/>
  <line x1="90" y1="250" x2="90" y2="96" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ax)"/>
  <text x="100" y="98" font-size="14" fill="#b91c1c" font-weight="bold">Z（U）</text>
  <circle cx="90" cy="250" r="5" fill="#b91c1c"/>
  <text x="40" y="292" font-size="12" fill="#b91c1c">原點：艉垂線（AP）附近、基線、中心線</text>
  <text x="560" y="292" font-size="13" fill="#b91c1c" font-weight="bold">X（E）向艏 →</text>

  <!-- plan view -->
  <text x="30" y="332" font-size="15" font-weight="bold" fill="#374151">俯視（Plan）：X 向艏、Y 向左舷</text>
  <path d="M90 380 L 740 380 Q 830 380 840 470 Q 830 560 740 560 L 90 560 Z" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <!-- centerline -->
  <line x1="60" y1="470" x2="860" y2="470" stroke="#374151" stroke-dasharray="10,4,2,4"/>
  <text x="760" y="464" font-size="12" fill="#374151">中心線 CL（Y = 0）</text>
  <!-- LP lines -->
  <g stroke="#86efac" stroke-width="1">
    <line x1="90" y1="448" x2="760" y2="448"/>
    <line x1="90" y1="426" x2="760" y2="426"/>
    <line x1="90" y1="404" x2="760" y2="404"/>
    <line x1="90" y1="492" x2="760" y2="492"/>
    <line x1="90" y1="514" x2="760" y2="514"/>
    <line x1="90" y1="536" x2="760" y2="536"/>
  </g>
  <g font-size="12" fill="#166534">
    <text x="96" y="445">LP1</text>
    <text x="96" y="423">LP2</text>
    <text x="96" y="401">LP3</text>
    <text x="96" y="489">LP1</text>
    <text x="96" y="511">LP2</text>
    <text x="96" y="533">LP3</text>
  </g>
  <!-- point -->
  <circle cx="598" cy="426" r="6" fill="#b45309"/>
  <text x="610" y="420" font-size="13" fill="#b45309" font-weight="bold">FR85+200, LP2（左舷）</text>
  <line x1="598" y1="380" x2="598" y2="560" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- axes -->
  <line x1="90" y1="470" x2="170" y2="470" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ax)"/>
  <line x1="90" y1="470" x2="90" y2="352" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ax)"/>
  <text x="100" y="356" font-size="14" fill="#b91c1c" font-weight="bold">Y（N）</text>
  <circle cx="90" cy="470" r="5" fill="#b91c1c"/>
  <text x="300" y="372" font-size="13" fill="#1f2937">左舷 Port：+Y</text>
  <text x="300" y="580" font-size="13" fill="#1f2937">右舷 Starboard：−Y</text>

  <!-- legend -->
  <rect x="20" y="594" width="860" height="38" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="34" y="618" font-size="13" fill="#1f2937">對應：E ↔ X（向艏）、N ↔ Y（向左舷）、U ↔ Z（向上）。肋距可分區不同，FR 換算成 X 要查專案的肋位表。LP 位置依專案定義。</text>
</svg>
