<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <rect x="0" y="0" width="900" height="650" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">平面板架的資料樹：HPANEL 與它的成員</text>

  <!-- left chain -->
  <g font-size="13" fill="#1f2937">
    <rect x="50" y="70" width="180" height="52" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="140" y="92" text-anchor="middle" font-weight="bold">WORLD</text>
    <text x="140" y="111" text-anchor="middle" font-size="12">資料庫的根</text>

    <rect x="50" y="160" width="180" height="52" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="140" y="182" text-anchor="middle" font-weight="bold">HBLWLD</text>
    <text x="140" y="201" text-anchor="middle" font-size="12">船體分段世界</text>

    <rect x="50" y="250" width="180" height="52" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="140" y="272" text-anchor="middle" font-weight="bold">BLOCK</text>
    <text x="140" y="291" text-anchor="middle" font-size="12">分段（建造單位）</text>

    <rect x="50" y="340" width="180" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="140" y="362" text-anchor="middle" font-weight="bold">HPANEL</text>
    <text x="140" y="381" text-anchor="middle" font-size="12">平面板架（建模環境）</text>

    <rect x="50" y="430" width="180" height="52" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="140" y="452" text-anchor="middle" font-weight="bold">CPANEL</text>
    <text x="140" y="471" text-anchor="middle" font-size="12">曲面板架</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <line x1="140" y1="122" x2="140" y2="160"/>
    <line x1="140" y1="212" x2="140" y2="250"/>
    <line x1="140" y1="302" x2="140" y2="340"/>
    <polyline points="50,276 38,276 38,456 50,456"/>
    <!-- bus -->
    <line x1="230" y1="366" x2="260" y2="366"/>
    <line x1="260" y1="56" x2="260" y2="516"/>
    <line x1="260" y1="56" x2="575" y2="56"/>
    <line x1="575" y1="56" x2="575" y2="456"/>
  </g>

  <!-- col1 members -->
  <g font-size="13" fill="#1f2937">
    <g stroke="#6b7280" stroke-width="1.5">
      <line x1="260" y1="96" x2="290" y2="96"/>
      <line x1="260" y1="156" x2="290" y2="156"/>
      <line x1="260" y1="216" x2="290" y2="216"/>
      <line x1="260" y1="276" x2="290" y2="276"/>
      <line x1="260" y1="336" x2="290" y2="336"/>
      <line x1="260" y1="396" x2="290" y2="396"/>
      <line x1="260" y1="456" x2="290" y2="456"/>
      <line x1="260" y1="516" x2="290" y2="516"/>
    </g>
    <rect x="290" y="70" width="270" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="302" y="91" font-weight="bold">HPANBO　邊界</text>
    <text x="302" y="110" font-size="12" fill="#4b5563">封閉輪廓，常參考其他板架或曲面</text>

    <rect x="290" y="130" width="270" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="302" y="151" font-weight="bold">HSEAM　接縫</text>
    <text x="302" y="170" font-size="12" fill="#4b5563">把板架切分成多塊板</text>

    <rect x="290" y="190" width="270" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="302" y="211" font-weight="bold">HPLATE　板</text>
    <text x="302" y="230" font-size="12" fill="#4b5563">厚度、型面側、材質</text>

    <rect x="290" y="250" width="270" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="302" y="271" font-weight="bold">HSTIFF　加強材</text>
    <text x="302" y="290" font-size="12" fill="#4b5563">成員：HPRCUT HPREND HPRHOL HPRNOT</text>

    <rect x="290" y="310" width="270" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="302" y="331" font-weight="bold">HFLANG　折邊</text>
    <text x="302" y="350" font-size="12" fill="#4b5563">板緣折邊</text>

    <rect x="290" y="370" width="270" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="302" y="391" font-weight="bold">HBRCKT　肘板</text>
    <text x="302" y="410" font-size="12" fill="#4b5563">成員：HBRABO HBRFLA HBRSTI</text>

    <rect x="290" y="430" width="270" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="302" y="451" font-weight="bold">HNOTCH　缺口</text>
    <text x="302" y="470" font-size="12" fill="#4b5563">切入外輪廓：避讓孔、流水孔</text>

    <rect x="290" y="490" width="270" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="302" y="511" font-weight="bold">HCTOUT　切口</text>
    <text x="302" y="530" font-size="12" fill="#4b5563">讓穿越的型材通過</text>
  </g>

  <!-- col2 members -->
  <g font-size="13" fill="#1f2937">
    <g stroke="#6b7280" stroke-width="1.5">
      <line x1="575" y1="96" x2="595" y2="96"/>
      <line x1="575" y1="156" x2="595" y2="156"/>
      <line x1="575" y1="216" x2="595" y2="216"/>
      <line x1="575" y1="276" x2="595" y2="276"/>
      <line x1="575" y1="336" x2="595" y2="336"/>
      <line x1="575" y1="396" x2="595" y2="396"/>
      <line x1="575" y1="456" x2="595" y2="456"/>
    </g>
    <rect x="595" y="70" width="280" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="607" y="91" font-weight="bold">HHOLE　開孔</text>
    <text x="607" y="110" font-size="12" fill="#4b5563">人孔、減輕孔、管路／電纜貫穿孔</text>

    <rect x="595" y="130" width="280" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="607" y="151" font-weight="bold">HBEAD　壓筋</text>
    <text x="607" y="170" font-size="12" fill="#4b5563">板上的壓筋加強</text>

    <rect x="595" y="190" width="280" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="607" y="211" font-weight="bold">HDOPLA　複板</text>
    <text x="607" y="230" font-size="12" fill="#4b5563">局部加厚用的疊板</text>

    <rect x="595" y="250" width="280" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="607" y="271" font-weight="bold">HPILLR　柱</text>
    <text x="607" y="290" font-size="12" fill="#4b5563">支柱構件</text>

    <rect x="595" y="310" width="280" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="607" y="331" font-weight="bold">HCURVE／HPOINT</text>
    <text x="607" y="350" font-size="12" fill="#4b5563">建模用的輔助曲線與點</text>

    <rect x="595" y="370" width="280" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="607" y="391" font-weight="bold">HSUBPN　子板架</text>
    <text x="607" y="410" font-size="12" fill="#4b5563">板架內再細分的範圍</text>

    <rect x="595" y="430" width="280" height="52" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="607" y="451" font-weight="bold">HTAP</text>
    <text x="607" y="470" font-size="12" fill="#4b5563">Tap 元素（用途待核對）</text>
  </g>

  <!-- notes -->
  <g font-size="12" fill="#374151">
    <rect x="595" y="490" width="280" height="52" rx="5" fill="#fff7ed" stroke="#fdba74"/>
    <text x="607" y="511">黃框：本章重點元素</text>
    <text x="607" y="530">灰框：HPANEL 的合法成員</text>
    <text x="30" y="585">BLOCK 的合法擁有者為 HBLWLD 或 WORLD；合法成員為 HPANEL 與 CPANEL。</text>
    <text x="30" y="606">每個成員元素都帶有 TBID（Tribon ID）等屬性，對應船體 Databank 中的物件。</text>
    <text x="30" y="627" fill="#6b7280">依據：AVEVA E3D 2.1 Data Model Reference（Hull Planar、Hull General）。Marine 12.x 的實際清單請以公司版本確認。</text>
  </g>
</svg>
