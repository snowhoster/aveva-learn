<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">專案 ABC：使用者、Team、DB 與 MDB 的關係（範例）</text>

  <!-- SYST -->
  <rect x="20" y="46" width="860" height="40" rx="6" fill="#f5f3ff" stroke="#6d28d9"/>
  <text x="450" y="72" font-size="14" text-anchor="middle" fill="#4c1d95">SYST 系統資料庫：記錄下方所有使用者、Team、DB、MDB 的定義（由 Admin 維護）</text>

  <!-- columns titles -->
  <text x="110" y="116" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">使用者 User</text>
  <text x="350" y="116" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">團隊 Team</text>
  <text x="680" y="116" font-size="15" font-weight="bold" text-anchor="middle" fill="#374151">資料庫 DB（名稱 = Team/DB）</text>

  <!-- users -->
  <rect x="30" y="130" width="160" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="110" y="155" font-size="14" text-anchor="middle">WANG（管路設計）</text>
  <rect x="30" y="190" width="160" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="110" y="215" font-size="14" text-anchor="middle">LIN（船體設計）</text>
  <rect x="30" y="250" width="160" height="40" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="110" y="275" font-size="14" text-anchor="middle">CHEN（目錄管理）</text>

  <!-- teams -->
  <rect x="270" y="130" width="160" height="40" rx="6" fill="#fef3c7" stroke="#a16207"/>
  <text x="350" y="155" font-size="14" text-anchor="middle">PIPING</text>
  <rect x="270" y="190" width="160" height="40" rx="6" fill="#fef3c7" stroke="#a16207"/>
  <text x="350" y="215" font-size="14" text-anchor="middle">HULL</text>
  <rect x="270" y="250" width="160" height="40" rx="6" fill="#fef3c7" stroke="#a16207"/>
  <text x="350" y="275" font-size="14" text-anchor="middle">CATADMIN</text>

  <g stroke="#374151" stroke-width="1.5" marker-end="url(#a)">
    <line x1="190" y1="150" x2="266" y2="150"/>
    <line x1="190" y1="210" x2="266" y2="210"/>
    <line x1="190" y1="270" x2="266" y2="270"/>
  </g>
  <text x="228" y="142" font-size="12" text-anchor="middle" fill="#6b7280">屬於</text>

  <!-- dbs -->
  <g font-size="13">
    <rect x="520" y="130" width="320" height="34" rx="5" fill="#ecfdf5" stroke="#047857"/>
    <text x="536" y="152">PIPING/ZONE-ER　DESI　（機艙管路）</text>
    <rect x="520" y="172" width="320" height="34" rx="5" fill="#ecfdf5" stroke="#047857"/>
    <text x="536" y="194">HULL/BLOCK-B12　DESI　（船體模型）</text>
    <rect x="520" y="214" width="320" height="34" rx="5" fill="#ecfdf5" stroke="#047857"/>
    <text x="536" y="236">CATADMIN/CATA　CATA　（目錄與等級）</text>
    <rect x="520" y="256" width="320" height="34" rx="5" fill="#ecfdf5" stroke="#047857"/>
    <text x="536" y="278">CATADMIN/DICT　DICT　（UDA 定義）</text>
  </g>
  <g stroke="#047857" stroke-width="1.5" marker-end="url(#g)">
    <line x1="430" y1="150" x2="516" y2="147"/>
    <line x1="430" y1="210" x2="516" y2="189"/>
    <line x1="430" y1="268" x2="516" y2="231"/>
    <line x1="430" y1="274" x2="516" y2="273"/>
  </g>
  <text x="474" y="132" font-size="12" text-anchor="middle" fill="#047857">擁有</text>

  <!-- MDB -->
  <rect x="20" y="320" width="860" height="170" rx="8" fill="#f9fafb" stroke="#1d4ed8" stroke-dasharray="6,4"/>
  <text x="36" y="346" font-size="15" font-weight="bold" fill="#1e3a8a">WANG 登入時選擇的 MDB：/PIPE-MDB（掛載順序由上而下）</text>
  <g font-size="13">
    <rect x="40" y="360" width="400" height="28" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="54" y="379">1　PIPING/ZONE-ER</text>
    <text x="420" y="379" text-anchor="end" fill="#047857" font-weight="bold">可寫（WANG 是 PIPING 成員）</text>
    <rect x="40" y="394" width="400" height="28" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="54" y="413">2　HULL/BLOCK-B12</text>
    <text x="420" y="413" text-anchor="end" fill="#b91c1c">唯讀（非 HULL 成員）</text>
    <rect x="40" y="428" width="400" height="28" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="54" y="447">3　CATADMIN/CATA</text>
    <text x="420" y="447" text-anchor="end" fill="#b91c1c">唯讀</text>
    <rect x="40" y="462" width="400" height="22" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="54" y="478" font-size="12">4　CATADMIN/DICT　唯讀</text>
  </g>
  <g font-size="13" fill="#1f2937">
    <text x="470" y="376">MDB 決定「這次連線看得到哪些 DB」。</text>
    <text x="470" y="400">Team 成員資格決定「哪些 DB 寫得進去」。</text>
    <text x="470" y="424">不在 MDB 裡的 DB：元素完全看不到，</text>
    <text x="470" y="444">參照到它的屬性只會顯示無法解析的參照。</text>
    <text x="470" y="470">類比：MDB ≈ 資料庫 search path；Team ≈ 角色。</text>
  </g>

  <!-- bottom notes -->
  <rect x="20" y="506" width="860" height="78" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="36" y="530" font-size="14" font-weight="bold" fill="#7c2d12">寫入權限 = 三個條件同時成立</text>
  <text x="36" y="554" font-size="13" fill="#1f2937">① DB 在目前 MDB 中　② 使用者屬於擁有該 DB 的 Team，且 DB 允許寫入　③ 元素沒有被他人認領（Claim）</text>
  <text x="36" y="574" font-size="12" fill="#6b7280">名稱為示意。實際 Team、DB、MDB 由公司管理員規劃。</text>
</svg>
