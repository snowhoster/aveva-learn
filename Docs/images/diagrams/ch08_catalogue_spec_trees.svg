<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">目錄樹、等級樹與參數化元件</text>

  <!-- catalogue tree -->
  <text x="30" y="62" font-size="14" font-weight="bold" fill="#166534">目錄樹（主檔資料）</text>
  <g font-size="13" fill="#1f2937">
    <rect x="30" y="76" width="190" height="38" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="42" y="100">CATA　目錄</text>
    <rect x="55" y="128" width="190" height="38" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="67" y="152">SECT　區段</text>
    <rect x="80" y="180" width="190" height="38" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="92" y="204">CATE　類別（如閘閥）</text>
    <rect x="105" y="232" width="190" height="38" rx="5" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <text x="117" y="256">SCOM　元件（每口徑一筆）</text>
    <rect x="105" y="280" width="190" height="38" rx="5" fill="#ffffff" stroke="#16a34a"/>
    <text x="117" y="304">GMSE　幾何集</text>
    <rect x="105" y="328" width="190" height="38" rx="5" fill="#ffffff" stroke="#16a34a"/>
    <text x="117" y="352">PTSE　點集</text>
  </g>
  <g fill="none" stroke="#6b7280" stroke-width="1.5">
    <polyline points="42,114 42,147 55,147"/>
    <polyline points="67,166 67,199 80,199"/>
    <polyline points="92,218 92,347 105,347"/>
    <line x1="92" y1="251" x2="105" y2="251"/>
    <line x1="92" y1="299" x2="105" y2="299"/>
  </g>
  <text x="30" y="392" font-size="12" fill="#374151">多個 SCOM 可共用同一組 GMSE／PTSE，</text>
  <text x="30" y="410" font-size="12" fill="#374151">差別只在 PARA 參數值。GMSE／PTSE 的</text>
  <text x="30" y="428" font-size="12" fill="#374151">擁有者可能是 CATE 或 SECT〔依目錄規劃〕。</text>

  <!-- spec tree -->
  <text x="330" y="62" font-size="14" font-weight="bold" fill="#854d0e">等級樹（允許值規則）</text>
  <g font-size="13" fill="#1f2937">
    <rect x="330" y="76" width="200" height="38" rx="5" fill="#fefce8" stroke="#ca8a04"/>
    <text x="342" y="100">SPWL　等級世界〔待核對〕</text>
    <rect x="355" y="128" width="190" height="38" rx="5" fill="#fefce8" stroke="#ca8a04"/>
    <text x="367" y="152">SPEC　/A1A</text>
    <rect x="380" y="180" width="190" height="38" rx="5" fill="#fefce8" stroke="#ca8a04"/>
    <text x="392" y="204">SELE　問：型式？</text>
    <rect x="405" y="232" width="190" height="38" rx="5" fill="#fefce8" stroke="#ca8a04"/>
    <text x="417" y="256">SELE　答 VALV，問：口徑？</text>
    <rect x="430" y="284" width="165" height="38" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <text x="442" y="308">SPCO　答 50</text>
    <rect x="430" y="332" width="165" height="38" rx="5" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <text x="442" y="356">SPCO　答 80</text>
  </g>
  <g fill="none" stroke="#6b7280" stroke-width="1.5">
    <polyline points="342,114 342,147 355,147"/>
    <polyline points="367,166 367,199 380,199"/>
    <polyline points="392,218 392,251 405,251"/>
    <polyline points="417,270 417,351 430,351"/>
    <line x1="417" y1="303" x2="430" y2="303"/>
  </g>
  <text x="330" y="392" font-size="12" fill="#374151">選元件＝沿 SELE 一層層回答問題，</text>
  <text x="330" y="410" font-size="12" fill="#374151">走到葉節點 SPCO；設計元件記下它的參照。</text>
  <text x="330" y="428" font-size="12" fill="#374151">問題與答案的屬性名稱見本章內文〔待核對〕。</text>

  <!-- parameterisation -->
  <text x="625" y="62" font-size="14" font-weight="bold" fill="#1e40af">參數驅動幾何（示意）</text>
  <g font-size="12" fill="#1f2937">
    <rect x="625" y="76" width="255" height="96" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="637" y="98" font-weight="bold">SCOM 的 PARA（DN50 閘閥）</text>
    <text x="637" y="120">PARA[1] = 50　公稱口徑</text>
    <text x="637" y="140">PARA[2] = 178　面對面長度</text>
    <text x="637" y="160">PARA[3] = 165　法蘭外徑</text>

    <rect x="625" y="186" width="255" height="96" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="637" y="208" font-weight="bold">GMSE 中的一個圓柱基本體</text>
    <text x="637" y="230">直徑 = PARAM 3</text>
    <text x="637" y="250">高度 = PARAM 2</text>
    <text x="637" y="270">（以參數運算式表示，非固定值）</text>

    <rect x="625" y="296" width="255" height="96" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="637" y="318" font-weight="bold">PTSE 中的 p-point</text>
    <text x="637" y="340">P1：-X 方向，距中心 PARAM 2 / 2</text>
    <text x="637" y="360">P2：+X 方向，距中心 PARAM 2 / 2</text>
    <text x="637" y="380">口徑 = PARAM 1</text>
  </g>
  <text x="625" y="416" font-size="12" fill="#374151">換成 DN80：只換一筆 SCOM 的 PARA，</text>
  <text x="625" y="434" font-size="12" fill="#374151">幾何與 p-point 自動跟著變。</text>

  <rect x="20" y="460" width="860" height="86" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <g font-size="12" fill="#374151">
    <text x="36" y="484" font-weight="bold" fill="#1f2937">開發對照</text>
    <text x="36" y="506">目錄＝產品主檔（Product Master）；等級＝「某系統允許哪些料號」的規則表；SPCO＝規則表中的一列，以 CATREF 指向主檔。</text>
    <text x="36" y="528">參數化元件＝一個「類別定義（GMSE／PTSE）」配上多組「建構參數（PARA）」，類似以參數具現化的範本。</text>
  </g>
</svg>
