<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="a7" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4b5563"/>
    </marker>
    <marker id="a7b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">PIPE／BRAN／元件：資料樹與實體路徑的對應</text>

  <!-- data tree -->
  <text x="20" y="58" font-size="14" font-weight="bold" fill="#4338ca">資料樹</text>
  <g font-size="13" fill="#1f2937">
    <rect x="20" y="70" width="210" height="52" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="32" y="92" font-weight="bold">PIPE /P-100</text>
    <text x="32" y="111" font-size="12">PSPE 管路等級、系統屬性</text>

    <rect x="40" y="140" width="210" height="52" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="52" y="162" font-weight="bold">BRAN /P-100/B1</text>
    <text x="52" y="181" font-size="12">Head／Tail 屬性、HSTU</text>
  </g>
  <polyline points="30,122 30,166 40,166" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <text x="280" y="132" font-size="12" fill="#374151">MEMBERS 的順序＝從 Head 到 Tail 的流向順序</text>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <rect x="280" y="146" width="66" height="40" rx="5" fill="#f9fafb" stroke="#9ca3af"/><text x="313" y="171">FLAN</text>
    <rect x="354" y="146" width="66" height="40" rx="5" fill="#f9fafb" stroke="#9ca3af"/><text x="387" y="171">ELBO</text>
    <rect x="428" y="146" width="66" height="40" rx="5" fill="#f9fafb" stroke="#9ca3af"/><text x="461" y="171">ELBO</text>
    <rect x="502" y="146" width="66" height="40" rx="5" fill="#f9fafb" stroke="#9ca3af"/><text x="535" y="171">VALV</text>
    <rect x="576" y="146" width="66" height="40" rx="5" fill="#f9fafb" stroke="#9ca3af"/><text x="609" y="171">TEE</text>
    <rect x="650" y="146" width="66" height="40" rx="5" fill="#f9fafb" stroke="#9ca3af"/><text x="683" y="171">ELBO</text>
    <rect x="724" y="146" width="66" height="40" rx="5" fill="#f9fafb" stroke="#9ca3af"/><text x="757" y="171">ELBO</text>
    <rect x="798" y="146" width="66" height="40" rx="5" fill="#f9fafb" stroke="#9ca3af"/><text x="831" y="171">FLAN</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.5" marker-end="url(#a7)">
    <line x1="250" y1="166" x2="278" y2="166"/>
    <line x1="346" y1="166" x2="353" y2="166"/>
    <line x1="420" y1="166" x2="427" y2="166"/>
    <line x1="494" y1="166" x2="501" y2="166"/>
    <line x1="568" y1="166" x2="575" y2="166"/>
    <line x1="642" y1="166" x2="649" y2="166"/>
    <line x1="716" y1="166" x2="723" y2="166"/>
    <line x1="790" y1="166" x2="797" y2="166"/>
  </g>
  <text x="280" y="210" font-size="12" fill="#374151">每個元件都有 SPRE（指向等級）、ARRI／LEAV（入口與出口的 p-point 編號）、LSTU（其後直管的等級）。</text>

  <line x1="20" y1="232" x2="880" y2="232" stroke="#e5e7eb" stroke-width="2"/>
  <text x="20" y="258" font-size="14" font-weight="bold" fill="#4338ca">實體路徑（平面示意）</text>

  <!-- equipment -->
  <g font-size="13" fill="#1f2937">
    <rect x="30" y="330" width="110" height="90" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="85" y="370" text-anchor="middle" font-weight="bold">EQUI</text>
    <text x="85" y="390" text-anchor="middle" font-size="12">/PUMP-1</text>
    <rect x="770" y="330" width="100" height="90" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="820" y="370" text-anchor="middle" font-weight="bold">EQUI</text>
    <text x="820" y="390" text-anchor="middle" font-size="12">/TANK-2</text>
  </g>
  <!-- nozzles -->
  <rect x="140" y="367" width="12" height="16" fill="#0284c7"/>
  <rect x="758" y="367" width="12" height="16" fill="#0284c7"/>

  <!-- pipe path -->
  <polyline points="152,375 300,375 300,490 680,490 680,375 758,375" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linejoin="round"/>
  <!-- components symbols -->
  <g stroke="#1f2937" stroke-width="2" fill="#ffffff">
    <rect x="168" y="362" width="8" height="26"/>
    <rect x="730" y="362" width="8" height="26"/>
    <circle cx="300" cy="375" r="8"/>
    <circle cx="300" cy="490" r="8"/>
    <circle cx="680" cy="490" r="8"/>
    <circle cx="680" cy="375" r="8"/>
    <path d="M415,478 L445,502 L445,478 L415,502 z"/>
    <rect x="552" y="480" width="16" height="20"/>
  </g>
  <line x1="560" y1="500" x2="560" y2="560" stroke="#f59e0b" stroke-width="6"/>

  <!-- head / tail labels -->
  <g font-size="12" fill="#1f2937">
    <circle cx="152" cy="375" r="5" fill="#dc2626"/>
    <text x="160" y="300" font-weight="bold" fill="#b91c1c">Head（起點）</text>
    <text x="160" y="318">HPOS／HDIR／HBOR／HCON</text>
    <text x="160" y="336" fill="#1d4ed8">HREF → /PUMP-1 的管嘴 N1</text>
    <circle cx="758" cy="375" r="5" fill="#dc2626"/>
    <text x="745" y="282" text-anchor="end" font-weight="bold" fill="#b91c1c">Tail（終點）</text>
    <text x="745" y="300" text-anchor="end">TPOS／TDIR／TBOR／TCON</text>
    <text x="745" y="318" text-anchor="end" fill="#1d4ed8">TREF → /TANK-2 的管嘴 N1</text>

    <text x="172" y="410">FLAN</text>
    <text x="312" y="368">ELBO</text>
    <text x="312" y="520">ELBO</text>
    <text x="430" y="526" text-anchor="middle">VALV</text>
    <text x="580" y="520">TEE</text>
    <text x="640" y="520">ELBO</text>
    <text x="640" y="368">ELBO</text>
    <text x="712" y="410">FLAN</text>

    <text x="320" y="436" font-weight="bold" fill="#92400e">隱含直管（Tube）</text>
    <text x="320" y="454" fill="#92400e">直管不是元素：由前一元件的</text>
    <text x="320" y="472" fill="#92400e">LEAV 點到下一元件 ARRI 點自動補上</text>

    <text x="572" y="560" fill="#1d4ed8">另一條 BRAN 的 Head：HREF → 此 TEE</text>
    <text x="572" y="578">（分支在 TEE 處接出）</text>
  </g>
  <line x1="200" y1="560" x2="250" y2="560" stroke="#2563eb" stroke-width="2" marker-end="url(#a7b)"/>
  <text x="258" y="564" font-size="12" fill="#1f2937">流向：Head → Tail</text>

  <rect x="20" y="596" width="860" height="34" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="34" y="618" font-size="12" fill="#374151">開發觀點：HREF／TREF 是外鍵（指向管嘴、TEE 或另一 BRAN）；未連接時為空參照。BRAN 是有序串列，不是無序集合。</text>
</svg>
