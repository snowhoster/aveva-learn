<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">導覽與收集：用 DBREF 走樹，用 COLLECTION 一次撈</text>

  <!-- tree -->
  <text x="30" y="64" font-size="15" font-weight="bold" fill="#1f2937">A. 導覽（一次走一步）</text>
  <g font-size="13" fill="#1f2937">
    <rect x="150" y="80" width="120" height="34" rx="5" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="210" y="102" text-anchor="middle" font-family="Consolas, monospace">SITE /S-TRN</text>

    <rect x="150" y="150" width="120" height="34" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="210" y="172" text-anchor="middle" font-family="Consolas, monospace">ZONE /Z-ER</text>
    <text x="282" y="172" fill="#b45309" font-weight="bold">← !!ce</text>

    <rect x="30" y="230" width="120" height="34" rx="5" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="90" y="252" text-anchor="middle" font-family="Consolas, monospace">EQUI /P-101A</text>
    <rect x="160" y="230" width="120" height="34" rx="5" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="220" y="252" text-anchor="middle" font-family="Consolas, monospace">EQUI /P-101B</text>
    <rect x="290" y="230" width="110" height="34" rx="5" fill="#f0fdf4" stroke="#15803d"/>
    <text x="345" y="252" text-anchor="middle" font-family="Consolas, monospace">PIPE /FW-01</text>

    <rect x="30" y="310" width="120" height="34" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="90" y="332" text-anchor="middle" font-family="Consolas, monospace">NOZZ N1</text>
    <rect x="160" y="310" width="120" height="34" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
    <text x="220" y="332" text-anchor="middle" font-family="Consolas, monospace">CYLI 1</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.2">
    <line x1="210" y1="114" x2="210" y2="150"/>
    <line x1="210" y1="184" x2="90" y2="230"/>
    <line x1="210" y1="184" x2="220" y2="230"/>
    <line x1="210" y1="184" x2="345" y2="230"/>
    <line x1="90" y1="264" x2="90" y2="310"/>
    <line x1="90" y1="264" x2="220" y2="310"/>
  </g>
  <g font-size="13" fill="#1d4ed8">
    <path d="M 140 160 C 110 140, 110 110, 146 98" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrb)"/>
    <text x="30" y="130">!!ce.owner</text>
    <text x="292" y="300">!!ce.members → ARRAY</text>
  </g>
  <rect x="30" y="368" width="390" height="92" rx="6" fill="#f9fafb" stroke="#6b7280"/>
  <g font-size="13" fill="#1f2937">
    <text x="44" y="392"><tspan font-family="Consolas, monospace">!!ce = !!ce.owner</tspan>　移動 CE（畫面跟著變）</text>
    <text x="44" y="416"><tspan font-family="Consolas, monospace">!e = !!ce.members[1]</tspan>　只取參照，CE 不動</text>
    <text x="44" y="440"><tspan font-family="Consolas, monospace">!e.owner.name</tspan>　可以一路點下去</text>
  </g>

  <!-- collection pipeline -->
  <text x="460" y="64" font-size="15" font-weight="bold" fill="#1f2937">B. 收集（宣告條件，一次取回）</text>
  <g font-size="13" fill="#1f2937">
    <rect x="460" y="80" width="410" height="60" rx="6" fill="#fffbeb" stroke="#b45309"/>
    <text x="474" y="104" font-weight="bold">範圍 scope</text>
    <text x="474" y="126" font-family="Consolas, monospace">!coll.scope(/Z-ER)　沒設 = 整個 MDB</text>

    <rect x="460" y="158" width="410" height="60" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="474" y="182" font-weight="bold">型別 type</text>
    <text x="474" y="204" font-family="Consolas, monospace">!coll.type('EQUI')</text>

    <rect x="460" y="236" width="410" height="60" rx="6" fill="#f5f3ff" stroke="#6d28d9"/>
    <text x="474" y="260" font-weight="bold">篩選 filter（EXPRESSION）</text>
    <text x="474" y="282" font-family="Consolas, monospace">!coll.filter(object EXPRESSION(|PURP eq 'PUMP'|))</text>

    <rect x="460" y="314" width="410" height="60" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="474" y="338" font-weight="bold">結果 results()</text>
    <text x="474" y="360">DBREF 陣列：[/P-101A, /P-101B]</text>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="665" y1="140" x2="665" y2="156" marker-end="url(#arr)"/>
    <line x1="665" y1="218" x2="665" y2="234" marker-end="url(#arr)"/>
    <line x1="665" y1="296" x2="665" y2="312" marker-end="url(#arr)"/>
  </g>
  <rect x="460" y="392" width="410" height="68" rx="6" fill="#f9fafb" stroke="#6b7280"/>
  <text x="474" y="416" font-size="13" fill="#1f2937">像 SQL：FROM（scope）+ 表名（type）+ WHERE（filter）</text>
  <text x="474" y="440" font-size="13" fill="#1f2937">由系統在資料庫端走訪，比 PML 遞迴快很多</text>

  <rect x="30" y="482" width="840" height="60" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="46" y="506" font-size="13" fill="#1f2937">原則：讀資料時用 DBREF 變數（!e.desc），不要為了讀一個屬性就把 !!ce 移過去再移回來。</text>
  <text x="46" y="528" font-size="13" fill="#1f2937">移動 CE 會觸發介面更新與事件，迴圈裡做幾千次就會明顯變慢，也會讓使用者的畫面亂跳。</text>
</svg>
