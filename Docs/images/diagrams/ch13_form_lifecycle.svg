<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">PML2 表單生命週期與回呼時機</text>

  <!-- column 1: load -->
  <text x="30" y="62" font-size="14" font-weight="bold" fill="#6b7280">第一次 show（只發生一次）</text>
  <g font-size="13" fill="#1f2937">
    <rect x="30" y="74" width="270" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="44" y="96" font-family="Consolas, monospace">show !!mycollect</text>
    <text x="44" y="116">在索引中找到 mycollect.pmlfrm</text>

    <rect x="30" y="144" width="270" height="62" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="44" y="166" font-weight="bold">執行 setup form ... exit</text>
    <text x="44" y="188">建立表單物件、成員與所有 gadget</text>

    <rect x="30" y="226" width="270" height="62" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="44" y="248" font-weight="bold">建構子 .mycollect()</text>
    <text x="44" y="270">設定預設值、指定 initcall、okcall</text>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="165" y1="124" x2="165" y2="142" marker-end="url(#arr)"/>
    <line x1="165" y1="206" x2="165" y2="224" marker-end="url(#arr)"/>
    <line x1="300" y1="257" x2="356" y2="257" marker-end="url(#arr)"/>
  </g>

  <!-- column 2: every show -->
  <text x="360" y="62" font-size="14" font-weight="bold" fill="#6b7280">每一次 show 都會發生</text>
  <g font-size="13" fill="#1f2937">
    <rect x="360" y="74" width="250" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="374" y="96">之後再次 show（已載入）</text>
    <text x="374" y="116">不再執行建構子</text>

    <rect x="360" y="226" width="250" height="62" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="374" y="248" font-weight="bold">initcall</text>
    <text x="374" y="270">依目前 CE 刷新畫面；可拒絕顯示</text>

    <rect x="360" y="310" width="250" height="44" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="485" y="337" text-anchor="middle" font-weight="bold">表單顯示中（等待使用者）</text>
  </g>
  <line x1="485" y1="124" x2="485" y2="224" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="485" y1="288" x2="485" y2="308" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- column 3: events -->
  <text x="650" y="62" font-size="14" font-weight="bold" fill="#6b7280">顯示期間的事件</text>
  <g font-size="13" fill="#1f2937">
    <rect x="650" y="74" width="230" height="92" rx="6" fill="#f5f3ff" stroke="#6d28d9"/>
    <text x="664" y="96" font-weight="bold">gadget callback</text>
    <text x="664" y="118">按鈕被按、文字按 Enter、</text>
    <text x="664" y="138">清單選取、勾選切換</text>
    <text x="664" y="158">可執行多次，表單不關閉</text>

    <rect x="650" y="186" width="230" height="78" rx="6" fill="#f5f3ff" stroke="#6d28d9"/>
    <text x="664" y="208" font-weight="bold">開放式回呼 '!this.m('</text>
    <text x="664" y="230">多收到 !action 字串</text>
    <text x="664" y="250">（SELECT、UNSELECT 等）</text>
  </g>
  <path d="M 610 322 C 640 322, 640 140, 648 128" fill="none" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 648 150 C 620 160, 620 300, 612 316" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrg)"/>

  <!-- closing -->
  <g font-size="13" fill="#1f2937">
    <rect x="200" y="400" width="250" height="84" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
    <text x="214" y="422" font-weight="bold">按 OK 型按鈕</text>
    <text x="214" y="444">執行 okcall（主要工作）</text>
    <text x="214" y="466">然後隱藏表單</text>

    <rect x="490" y="400" width="250" height="84" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="504" y="422" font-weight="bold">按 CANCEL 型按鈕或右上角關閉</text>
    <text x="504" y="444">執行 cancelcall（撤銷動作）</text>
    <text x="504" y="466">gadget 回到顯示時的值，隱藏</text>
  </g>
  <line x1="460" y1="354" x2="330" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="510" y1="354" x2="610" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="200" y="504" width="540" height="40" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="470" y="529" font-size="13" text-anchor="middle" fill="#1f2937">隱藏後表單物件仍在記憶體中，成員的值保留；下次 show 從 initcall 開始</text>
  <line x1="325" y1="484" x2="325" y2="502" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="615" y1="484" x2="615" y2="502" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="30" y="562" width="840" height="62" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="46" y="586" font-size="13" fill="#1f2937">對照：建構子 ≈ 視窗類別的 constructor（一次）；initcall ≈ Form.Shown／OnActivated（每次）；</text>
  <text x="46" y="608" font-size="13" fill="#1f2937">callback ≈ Click 事件處理器；okcall ≈ 對話框 DialogResult.OK；cancelcall ≈ DialogResult.Cancel。</text>
</svg>
