<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="580" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">船體拓撲相依圖：修改外板接縫時，誰要重建？</text>

  <g font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">
    <text x="110" y="56">參考來源</text>
    <text x="320" y="56">主要結構</text>
    <text x="530" y="56">次要構件與細節</text>
    <text x="760" y="56">衍生資料（快照）</text>
  </g>

  <!-- edges (drawn first) -->
  <g stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="200" y1="98" x2="228" y2="98"/>
    <line x1="200" y1="112" x2="228" y2="214"/>
    <line x1="200" y1="228" x2="228" y2="228"/>
    <line x1="200" y1="240" x2="228" y2="350"/>
    <line x1="320" y1="126" x2="320" y2="198"/>
    <polyline points="410,108 425,108 425,366 412,366"/>
    <line x1="410" y1="228" x2="438" y2="228"/>
    <line x1="410" y1="352" x2="438" y2="244"/>
    <line x1="530" y1="256" x2="530" y2="328"/>
    <polyline points="200,428 530,428 530,388"/>
    <line x1="620" y1="216" x2="668" y2="166"/>
    <line x1="620" y1="346" x2="668" y2="178"/>
    <line x1="760" y1="186" x2="760" y2="228"/>
  </g>
  <line x1="620" y1="362" x2="668" y2="362" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)"/>

  <!-- column 0 -->
  <g font-size="13" fill="#1f2937">
    <rect x="20" y="70" width="180" height="56" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="110" y="93" text-anchor="middle" font-weight="bold">船殼曲面</text>
    <text x="110" y="113" text-anchor="middle" font-size="12">Surface（初始設計）</text>

    <rect x="20" y="200" width="180" height="56" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="110" y="223" text-anchor="middle" font-weight="bold">定位系統</text>
    <text x="110" y="243" text-anchor="middle" font-size="12">FR／LP／甲板高度</text>

    <rect x="20" y="400" width="180" height="56" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="110" y="423" text-anchor="middle" font-weight="bold">舾裝開孔申請</text>
    <text x="110" y="443" text-anchor="middle" font-size="12">管路、電纜、通風</text>
  </g>

  <!-- column 1 -->
  <g font-size="13" fill="#1f2937">
    <rect x="230" y="70" width="180" height="56" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
    <text x="320" y="93" text-anchor="middle" font-weight="bold">外板接縫／外板縱骨</text>
    <text x="320" y="113" text-anchor="middle" font-size="12">修改起點（曲面船體）</text>

    <rect x="230" y="200" width="180" height="56" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="320" y="223" text-anchor="middle" font-weight="bold">艙壁 A</text>
    <text x="320" y="243" text-anchor="middle" font-size="12">邊界：外板、FR85</text>

    <rect x="230" y="330" width="180" height="56" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="320" y="353" text-anchor="middle" font-weight="bold">甲板 D</text>
    <text x="320" y="373" text-anchor="middle" font-size="12">邊界：外板、甲板高度</text>
  </g>

  <!-- column 2 -->
  <g font-size="13" fill="#1f2937">
    <rect x="440" y="200" width="180" height="56" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="530" y="223" text-anchor="middle" font-weight="bold">縱桁 B</text>
    <text x="530" y="243" text-anchor="middle" font-size="12">邊界：艙壁 A、甲板 D</text>

    <rect x="440" y="330" width="180" height="56" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="530" y="353" text-anchor="middle" font-weight="bold">B 上的細節</text>
    <text x="530" y="373" text-anchor="middle" font-size="12">開孔、肘板、缺口、切口</text>
  </g>

  <!-- column 3 -->
  <g font-size="13" fill="#1f2937">
    <rect x="670" y="130" width="180" height="56" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="760" y="153" text-anchor="middle" font-weight="bold">生產零件</text>
    <text x="760" y="173" text-anchor="middle" font-size="12">需重新抽出</text>

    <rect x="670" y="230" width="180" height="56" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="760" y="253" text-anchor="middle" font-weight="bold">套料與 NC</text>
    <text x="760" y="273" text-anchor="middle" font-size="12">需重新套料</text>

    <rect x="670" y="334" width="180" height="56" rx="6" fill="#fff1f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="760" y="357" text-anchor="middle" font-weight="bold">圖面</text>
    <text x="760" y="377" text-anchor="middle" font-size="12">需更新並檢查標註</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#374151">
    <rect x="20" y="470" width="860" height="96" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <rect x="36" y="484" width="34" height="18" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="80" y="498">被修改的上游物件</text>
    <rect x="300" y="484" width="34" height="18" fill="#fff1f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="344" y="498">受影響：需重建、重新抽出或更新</text>
    <line x1="36" y1="522" x2="70" y2="522" stroke="#4b5563" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="80" y="526">被參考者 → 參考者（變更傳遞方向）</text>
    <line x1="300" y1="522" x2="334" y2="522" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)"/>
    <text x="344" y="526">圖面引用模型（更新後才反映）</text>
    <text x="36" y="552">開發觀點：這是一張有向無環圖（DAG），影響範圍＝從修改點出發、沿箭頭可到達的所有節點。</text>
  </g>
</svg>
