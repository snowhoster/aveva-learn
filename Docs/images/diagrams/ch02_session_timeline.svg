<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">Claim、Savework、Getwork 與 Session 的時間軸</text>

  <!-- lanes -->
  <text x="20" y="96" font-size="14" font-weight="bold" fill="#1e3a8a">使用者 A</text>
  <line x1="110" y1="90" x2="880" y2="90" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a)"/>
  <text x="20" y="206" font-size="14" font-weight="bold" fill="#047857">資料庫</text>
  <line x1="110" y1="200" x2="880" y2="200" stroke="#047857" stroke-width="4" marker-end="url(#a)"/>
  <text x="20" y="316" font-size="14" font-weight="bold" fill="#7c2d12">使用者 B</text>
  <line x1="110" y1="310" x2="880" y2="310" stroke="#c2410c" stroke-width="2" marker-end="url(#a)"/>

  <!-- DB sessions -->
  <g font-size="13">
    <rect x="130" y="186" width="90" height="28" rx="4" fill="#ecfdf5" stroke="#047857"/>
    <text x="175" y="205" text-anchor="middle">Session 41</text>
    <rect x="520" y="186" width="90" height="28" rx="4" fill="#ecfdf5" stroke="#047857"/>
    <text x="565" y="205" text-anchor="middle">Session 42</text>
  </g>

  <!-- A events -->
  <g font-size="13" fill="#1f2937">
    <circle cx="200" cy="90" r="6" fill="#1d4ed8"/>
    <text x="200" y="70" text-anchor="middle">claim X</text>
    <circle cx="320" cy="90" r="6" fill="#1d4ed8"/>
    <text x="320" y="70" text-anchor="middle">修改 X</text>
    <text x="320" y="118" text-anchor="middle" font-size="12" fill="#6b7280">只在 A 的工作區</text>
    <circle cx="565" cy="90" r="6" fill="#1d4ed8"/>
    <text x="565" y="70" text-anchor="middle">savework</text>
    <circle cx="700" cy="90" r="6" fill="#1d4ed8"/>
    <text x="700" y="70" text-anchor="middle">釋放 X（unclaim）</text>
  </g>
  <line x1="565" y1="96" x2="565" y2="182" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="575" y="150" font-size="12" fill="#1e3a8a">寫入，產生新 Session</text>

  <!-- B events -->
  <g font-size="13" fill="#1f2937">
    <circle cx="400" cy="310" r="6" fill="#c2410c"/>
    <text x="400" y="340" text-anchor="middle">嘗試修改 X → 失敗</text>
    <text x="400" y="358" text-anchor="middle" font-size="12" fill="#6b7280">X 已被 A 認領</text>
    <circle cx="470" cy="310" r="6" fill="#c2410c"/>
    <text x="470" y="290" text-anchor="middle" font-size="12">查詢 X：仍是舊值</text>
    <circle cx="640" cy="310" r="6" fill="#c2410c"/>
    <text x="640" y="340" text-anchor="middle">getwork</text>
    <text x="640" y="358" text-anchor="middle" font-size="12" fill="#6b7280">看到 Session 42 的新值</text>
    <circle cx="790" cy="310" r="6" fill="#c2410c"/>
    <text x="790" y="340" text-anchor="middle">claim X 成功</text>
  </g>
  <line x1="600" y1="214" x2="636" y2="302" stroke="#c2410c" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="110" y="376" width="770" height="34" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="495" y="398" font-size="13" text-anchor="middle" fill="#374151">類比：claim ≈ 資料列鎖定；savework ≈ commit；getwork ≈ 重新整理快照；Session ≈ 每次 commit 的版本號</text>
</svg>
