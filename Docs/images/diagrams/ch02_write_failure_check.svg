<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Segoe UI, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="660" fill="#ffffff"/>
  <text x="450" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1f2937">工具寫入失敗時的檢查順序</text>

  <rect x="300" y="46" width="300" height="38" rx="19" fill="#e0e7ff" stroke="#3730a3"/>
  <text x="450" y="70" font-size="14" text-anchor="middle">程式要修改元素 X 的屬性</text>

  <!-- decision boxes left column -->
  <g font-size="14" fill="#1f2937">
    <rect x="250" y="104" width="400" height="44" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="450" y="131" text-anchor="middle">① 找得到 X 嗎？（DB 在目前 MDB 中）</text>

    <rect x="250" y="178" width="400" height="44" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="450" y="205" text-anchor="middle">② 我屬於擁有該 DB 的 Team 嗎？</text>

    <rect x="250" y="252" width="400" height="44" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="450" y="279" text-anchor="middle">③ DB 本身允許寫入嗎？（非唯讀、非外部 DB）</text>

    <rect x="250" y="326" width="400" height="44" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="450" y="353" text-anchor="middle">④ X 是否已被其他使用者或 Extract 認領？</text>

    <rect x="250" y="400" width="400" height="44" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="450" y="427" text-anchor="middle">⑤ 顯式認領模式下，我 claim 了嗎？</text>

    <rect x="250" y="474" width="400" height="44" rx="6" fill="#ffffff" stroke="#374151"/>
    <text x="450" y="501" text-anchor="middle">⑥ 屬性本身可寫嗎？值是否合法？</text>

    <rect x="250" y="548" width="400" height="44" rx="6" fill="#ecfdf5" stroke="#047857"/>
    <text x="450" y="575" text-anchor="middle">修改成功（只存在自己的工作區）</text>
  </g>
  <g stroke="#374151" stroke-width="1.8" marker-end="url(#a)">
    <line x1="450" y1="84" x2="450" y2="100"/>
    <line x1="450" y1="148" x2="450" y2="174"/>
    <line x1="450" y1="222" x2="450" y2="248"/>
    <line x1="450" y1="296" x2="450" y2="322"/>
    <line x1="450" y1="370" x2="450" y2="396"/>
    <line x1="450" y1="444" x2="450" y2="470"/>
    <line x1="450" y1="518" x2="450" y2="544"/>
  </g>
  <g font-size="12" fill="#047857">
    <text x="458" y="166">是</text><text x="458" y="240">是</text><text x="458" y="314">是</text>
    <text x="458" y="388">否</text><text x="458" y="462">是或隱式</text><text x="458" y="536">是</text>
  </g>

  <!-- failure notes left/right -->
  <g font-size="13" fill="#7f1d1d">
    <line x1="250" y1="126" x2="214" y2="126" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="16" y="104" width="194" height="44" rx="5" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="26" y="122">否：名稱或參照無法解析</text>
    <text x="26" y="140">→ 換 MDB 或請管理員加入</text>

    <line x1="650" y1="200" x2="686" y2="200" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="690" y="178" width="196" height="44" rx="5" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="700" y="196">否：DB 對你是唯讀</text>
    <text x="700" y="214">→ 請管理員調整 Team</text>

    <line x1="250" y1="274" x2="214" y2="274" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="16" y="252" width="194" height="44" rx="5" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="26" y="270">否：唯讀或外部參照 DB</text>
    <text x="26" y="288">→ 到資料的原始專案修改</text>

    <line x1="650" y1="348" x2="686" y2="348" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="690" y="326" width="196" height="44" rx="5" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="700" y="344">是：等對方 savework 並</text>
    <text x="700" y="362">釋放，或協調後再改</text>

    <line x1="250" y1="422" x2="214" y2="422" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="16" y="400" width="194" height="44" rx="5" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="26" y="418">否：先 claim X</text>
    <text x="26" y="436">（程式應自行處理）</text>

    <line x1="650" y1="496" x2="686" y2="496" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="690" y="474" width="196" height="44" rx="5" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="700" y="492">否：偽屬性不能設定，</text>
    <text x="700" y="510">或值超出合法範圍</text>
  </g>

  <rect x="120" y="606" width="660" height="40" rx="6" fill="#fff7ed" stroke="#c2410c"/>
  <text x="450" y="631" font-size="14" text-anchor="middle" fill="#7c2d12">別人看得到嗎？要等你 savework，對方 getwork 之後才看得到。</text>
</svg>
